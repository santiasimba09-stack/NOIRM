# Publishes a GitHub Release with the jar when a version tag is pushed (e.g. v0.4).
# The jar is built here, so jars no longer need to be committed into the repository.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build -x test --no-daemon
      - name: Name the jar
        run: |
          jar=$(ls build/libs/noirm-*.jar | grep -v -- '-sources' | head -1)
          cp "$jar" "noirm-${GITHUB_REF_NAME}.jar"
      - name: Release notes from the changelog
        run: |
          # The newest CHANGELOG entry (from the first "## " heading to the next one).
          awk '/^## /{n++} n==1' docs/CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: noirm-${{ github.ref_name }}.jar
          body_path: notes.md
